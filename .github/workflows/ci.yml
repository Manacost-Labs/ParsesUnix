name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the package with dev tooling
        run: python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check src tests tools
      - name: Ruff format
        run: ruff format --check src tests tools
      - name: mypy (strict, package scope)
        run: mypy

  tests:
    name: unittest (stdlib only)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        run: python -m unittest discover -s tests -v

  browser-tests:
    # The L2 paths (real Chromium navigation, SSRF route guard, XHR capture)
    # cannot be covered by the stdlib job, where they skip. The fixture site is
    # served from localhost, so this job needs no external network.
    name: browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package with the browser extra
        run: python -m pip install -e '.[browser]'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: python -m unittest tests.test_browser_live -v

  provider-freshness:
    # Non-blocking signal on PRs: surfaces stale provider docs without gating
    # unrelated merges (the hard gate is the scheduled staleness-watchdog).
    name: provider docs freshness (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check provider reference is not stale (60 days)
        run: python tools/check_provider_freshness.py --max-age-days 60
