[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-scraper-core"
version = "0.9.1"
description = "Importable core of the web-scraper skill: contracts, triage, probe, profiles, budget, and the free Fetch Gateway (L0-L2)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Manacost Labs" }]
keywords = ["web-scraping", "crawler", "triage", "cost-aware", "anti-bot"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

[project.urls]
Repository = "https://github.com/Manacost-Labs/ParsesUnix"

[project.optional-dependencies]
# PyYAML is genuinely optional: profiles fall back to the built-in yamlish loader.
yaml = ["pyyaml>=6"]
# Browser reconnaissance and the L2 dynamic renderer.
# NOTE: also requires `playwright install chromium` after pip install.
browser = ["playwright>=1.40"]
# Scrapling transports (real L1 session / stealthy L2). Unpinned until the
# live API is verified per references/providers-and-stacks.md.
http = ["scrapling"]
dev = ["mypy>=1.8", "ruff>=0.5"]

[project.scripts]
ws-probe = "web_scraper.probe.cli:main"
ws-triage = "web_scraper.triage:main"
ws-profile = "web_scraper.profile_engineering.cli:main"
ws-budget = "web_scraper.budget:main"
ws-run = "web_scraper.run.cli:main"
ws-regress = "web_scraper.regression.cli:main"
ws-diagnose = "web_scraper.diagnose.cli:main"
ws-benchmark = "web_scraper.calibration.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
# Chosen for defect-finding, not style policing: pyflakes/bugbear catch real bugs,
# BLE/S forbid the swallow-everything pattern, DTZ catches naive-datetime billing
# bugs, and I/UP keep imports and syntax current.
select = ["E", "W", "F", "I", "UP", "B", "BLE", "S", "DTZ", "SIM", "RUF", "PIE", "C4"]
ignore = [
    "S101",  # assert: used deliberately in tests and as internal invariants
    "E501",  # line length is enforced by the formatter, not the linter
    "SIM105",  # contextlib.suppress is not clearer than try/except/pass here
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately import after sys.path setup and use loopback fixtures.
# S105-S107: test tokens are literal placeholders like "TESTTOKEN", and
# `token_env` is a variable name rather than a credential.
# S311: seeded Random() in tests is for reproducibility, not secrecy.
"tests/*" = ["E402", "S104", "S105", "S106", "S107", "S310", "S311", "RUF012"]
"tools/*" = ["S310"]
# S310: every URL reaching urlopen here has already passed validate_public_url,
# which rejects any scheme other than http/https and any non-public address.
"src/web_scraper/fetchers/transports.py" = ["S310"]
"src/web_scraper/probe/static.py" = ["S310"]
# RUF001: a literal NO-BREAK SPACE is the input these modules exist to normalize.
"src/web_scraper/extract/normalize.py" = ["RUF001"]
"tests/test_extract.py" = ["E402", "RUF001", "RUF012"]

[tool.mypy]
python_version = "3.11"
files = ["src/web_scraper"]
strict = true
# Playwright/Scrapling are optional extras; the package must type-check without them.
ignore_missing_imports = true

[[tool.mypy.overrides]]
# CLI modules are argparse glue whose argument objects are dynamically typed.
module = ["web_scraper.*.cli", "web_scraper.budget"]
disallow_any_expr = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
